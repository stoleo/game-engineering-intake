<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Engineering Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --bg2: #0c0c0e;
      --card: #121214;
      --line: rgba(255,255,255,.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --gold: #e8ff6a;
      --gold2: #f4ffa8;
      --teal: #c4c4cc;
      --danger: #fb7185;
      --ok: #4ade80;
      --ink: #111113;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 264px 1fr 336px;
      background:
        radial-gradient(900px 520px at 80% -10%, rgba(232,255,106,.06), transparent 42%),
        var(--bg);
    }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside, .preview { display: none; }
      .mobile-bar { display: flex !important; }
    }
    aside, .preview {
      background: var(--bg2);
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      overflow: auto;
    }
    .preview { border-right: 0; border-left: 1px solid var(--line); }
    .brand {
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 600;
    }
    .brand small {
      display: block;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      margin-top: 4px;
    }
    .nav { margin-top: 28px; display: flex; flex-direction: column; gap: 2px; }
    .nav button {
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: 13.5px;
    }
    .nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .nav button.active {
      background: rgba(255,255,255,.06);
      color: var(--text);
    }
    .nav button .n {
      display: inline-block;
      width: 22px;
      color: #71717a;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .nav button.active .n { color: var(--gold); }
    .nav button.done .n { color: var(--ok); }
    main { padding: 36px 48px 128px; overflow: auto; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(34px, 4.4vw, 56px);
      font-weight: 400;
      margin: 0 0 14px;
      letter-spacing: -.04em;
      line-height: .98;
      color: #fafafa;
    }
    .lede {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
      max-width: 62ch;
      font-size: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
      margin-bottom: 12px;
    }
    label { display: block; font-weight: 560; margin-bottom: 6px; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    input[type=text], textarea, select {
      width: 100%;
      background: #0a0a0b;
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 12px;
      font: inherit;
    }
    input[type=text]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: rgba(232,255,106,.55);
    }
    textarea { min-height: 88px; }
    textarea.tall { min-height: 120px; }
    .ghost, .gold, .teal, .danger {
      border: 1px solid rgba(255,255,255,.1);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }
    .ghost:hover, .teal:hover { background: rgba(255,255,255,.05); }
    .gold {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
      font-weight: 600;
    }
    .gold:hover { filter: brightness(1.04); }
    .teal { color: var(--muted); }
    .danger { color: var(--danger); border-color: rgba(251,113,133,.25); }
    .field-actions { margin-top: 8px; }
    .footer {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 32px;
      background: linear-gradient(transparent, var(--bg) 36%);
    }
    .meter {
      height: 3px;
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 0 28px;
    }
    .meter > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--gold);
      transition: width .35s ease;
    }
    .preview h2 {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin: 0 0 12px;
      font-weight: 500;
    }
    .preview pre {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.55;
      color: #d4d4d8;
      max-height: calc(100vh - 220px);
      overflow: auto;
    }
    .drop {
      border: 1px dashed rgba(255,255,255,.16);
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }
    .mobile-bar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(9,9,11,.92);
      padding: 10px 14px;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .chip {
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
    }
    .chip.bad { color: var(--danger); }
    .chip.good { color: var(--ok); }
    .ok { color: var(--ok); }
    .warn { color: var(--gold); }
    .kicker {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 8px 0 16px;
    }
    @media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
    .tile {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 16px;
      min-height: 164px;
    }
    .tile .n {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(232,255,106,.28);
    }
    .tile h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
    }
    .tile p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .flow { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .flow span {
      background: transparent;
      border: 1px solid var(--line);
      color: #e4e4e7;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .achieve { display: grid; gap: 8px; }
    .achieve li {
      list-style: none;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      color: #e4e4e7;
      font-size: 14px;
    }
    .achieve li b { color: var(--text); font-weight: 600; }
    ul.achieve { margin: 0; padding: 0; }
    .notthis { color: var(--muted); font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="mobile-bar"><b>Game Intake</b><button class="ghost" onclick="stepNext()">Next</button></div>
  <aside>
    <div class="brand">Game Engineering<small>Intake wizard</small></div>
    <div class="nav" id="nav"></div>
    <div style="margin-top:28px;font-size:12px;color:var(--muted);line-height:1.5">Answers stay in this browser.</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="ghost" onclick="resetAll()">Reset</button><button class="ghost" onclick="exportIntake()">Save intake</button></div>
  </aside>
  <main>
    <div class="meter"><span id="meter"></span></div>
    <div id="screen"></div>
    <div class="footer">
      <button class="ghost" onclick="stepPrev()">Back</button>
      <div><button class="teal" onclick="markSectionUnknown()">Mark empty as Unknown</button> <button class="gold" onclick="stepNext()" id="nextBtn">Next</button></div>
    </div>
  </main>
  <section class="preview"><h2>Live intake</h2><div class="chips" id="chips"></div><pre id="live"></pre></section>
  <script src="wizard-data.js?v=7"></script>
  <script src="wizard-app.js?v=7"></script>
</body>
</html>
