<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Engineering Intake</title>
  <style>
    :root { --bg:#0b0d12; --bg2:#10141c; --card:#171c26; --line:#2a3140; --text:#e8edf4; --muted:#8b95a8; --gold:#e0b15c; --gold2:#f0d19a; --teal:#7dcec4; --danger:#e07a6a; --ok:#8fd18a; }
    * { box-sizing: border-box; } html, body { margin:0; height:100%; }
    body { font-family: Segoe UI, IBM Plex Sans, system-ui, sans-serif; background:
      radial-gradient(1200px 600px at 10% -10%, #1b2433 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, #1a2a28 0%, transparent 50%),
      var(--bg); color:var(--text); display:grid; grid-template-columns:280px 1fr 340px; min-height:100vh; }
    @media (max-width:1100px){ body{grid-template-columns:1fr;} aside,.preview{display:none;} .mobile-bar{display:flex!important;} }
    aside,.preview{background:rgba(16,20,28,.92); border-right:1px solid var(--line); padding:22px 18px; overflow:auto;}
    .preview{border-right:0; border-left:1px solid var(--line);}
    .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700;}
    .brand small{display:block; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:400; margin-top:6px;}
    .nav{margin-top:22px; display:flex; flex-direction:column; gap:4px;}
    .nav button{text-align:left; background:transparent; border:0; color:var(--muted); padding:8px 10px; border-radius:8px; cursor:pointer; font:inherit;}
    .nav button.active{background:#243042; color:var(--gold2);}
    .nav button .n{display:inline-block; width:22px; color:var(--gold);}
    .nav button.done .n{color:var(--ok);}
    main{padding:28px 36px 120px; overflow:auto;}
    h1{font-size:34px; margin:0 0 8px; letter-spacing:-.03em;}
    .lede{color:var(--muted); line-height:1.6; margin-bottom:22px; max-width:68ch; font-size:16px;}
    .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;}
    label{display:block; font-weight:600; margin-bottom:6px;}
    .hint{color:var(--muted); font-size:13px; margin:0 0 8px;}
    input[type=text], textarea, select{width:100%; background:#0f131a; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 12px; font:inherit;}
    textarea{min-height:88px;} textarea.tall{min-height:120px;}
    .ghost,.gold,.teal,.danger{border:1px solid var(--line); background:#10151c; color:var(--text); border-radius:10px; padding:8px 12px; cursor:pointer; font:inherit;}
    .gold{background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:700;}
    .teal{color:var(--teal);} .danger{color:var(--danger);}
    .field-actions{margin-top:8px;}
    .footer{position:sticky; bottom:0; display:flex; justify-content:space-between; padding-top:24px; background:linear-gradient(transparent, var(--bg) 35%);}
    .meter{height:6px; background:#232a36; border-radius:99px; overflow:hidden; margin:14px 0 18px;}
    .meter>span{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--teal)); width:0;}
    .preview h2{font-size:13px; color:var(--muted); text-transform:uppercase;}
    .preview pre{white-space:pre-wrap; font-size:11px; color:#c9d2e0; max-height:calc(100vh - 220px); overflow:auto;}
    .drop{border:1px dashed #3a4558; border-radius:12px; padding:16px; text-align:center; color:var(--muted);}
    .mobile-bar{display:none; position:sticky; top:0; background:var(--bg2); padding:10px 14px; justify-content:space-between;}
    .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
    .chip{font-size:12px; border:1px solid var(--line); border-radius:99px; padding:4px 8px; color:var(--muted);}
    .chip.bad{color:var(--danger);} .chip.good{color:var(--ok);}
    .ok{color:var(--ok);} .warn{color:var(--gold2);}
    .kicker{color:var(--gold); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; margin-bottom:8px;}
    .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0 18px;}
    @media (max-width:900px){ .grid3{grid-template-columns:1fr;} }
    .tile{background:linear-gradient(180deg,#1b2230,#151a24); border:1px solid var(--line); border-radius:16px; padding:16px 16px 14px; min-height:150px;}
    .tile .n{width:28px; height:28px; border-radius:999px; display:grid; place-items:center; background:#2a2112; color:var(--gold); font-size:12px; font-weight:700; margin-bottom:10px;}
    .tile h3{margin:0 0 6px; font-size:15px;}
    .tile p{margin:0; color:var(--muted); font-size:13px; line-height:1.45;}
    .flow{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 16px;}
    .flow span{background:#121821; border:1px solid #313a4a; color:#c9d2e0; border-radius:999px; padding:6px 10px; font-size:12px;}
    .achieve{display:grid; gap:8px;}
    .achieve li{list-style:none; background:#121821; border:1px solid #2c3444; border-radius:12px; padding:10px 12px; color:#d5dbe6; font-size:14px;}
    .achieve li b{color:var(--gold2);}
    ul.achieve{margin:0; padding:0;}
    .notthis{color:var(--muted); font-size:13px; line-height:1.5;}
  </style>
</head>
<body>
  <div class="mobile-bar"><b>Game Intake</b><button class="ghost" onclick="stepNext()">Next</button></div>
  <aside>
    <div class="brand">Game Engineering<small>Intake wizard</small></div>
    <div class="nav" id="nav"></div>
    <div style="margin-top:22px;font-size:12px;color:var(--muted)">Answers stay in this browser.</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="ghost" onclick="resetAll()">Reset</button><button class="ghost" onclick="exportIntake()">Save intake</button></div>
  </aside>
  <main>
    <div class="meter"><span id="meter"></span></div>
    <div id="screen"></div>
    <div class="footer">
      <button class="ghost" onclick="stepPrev()">Back</button>
      <div><button class="teal" onclick="markSectionUnknown()">Mark empty as Unknown</button> <button class="gold" onclick="stepNext()" id="nextBtn">Next</button></div>
    </div>
  </main>
  <section class="preview"><h2>Live intake</h2><div class="chips" id="chips"></div><pre id="live"></pre></section>
  <script src="wizard-data.js?v=5"></script>
  <script src="wizard-app.js?v=5"></script>
</body>
</html>
