<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Engineering Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#08090d; --bg2:#0d1118; --card:rgba(22,27,38,.72); --line:rgba(224,177,92,.16);
      --text:#eef2f7; --muted:#8e98ab; --gold:#e3b45f; --gold2:#f4d7a0; --teal:#7dcec4;
      --danger:#e07a6a; --ok:#8fd18a; --ink:#1a1408;
    }
    * { box-sizing: border-box; } html, body { margin:0; height:100%; }
    body {
      font-family: Outfit, Segoe UI, system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(227,180,95,.16), transparent 55%),
        radial-gradient(800px 480px at 100% 0%, rgba(125,206,196,.10), transparent 50%),
        linear-gradient(180deg, #0c1018 0%, #08090d 100%);
    }
    body::before {
      content:"";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 20%, black 20%, transparent 75%);
    }
    aside, main, .preview, .mobile-bar { position: relative; z-index: 1; }
    @media (max-width:1100px){
      body{grid-template-columns:1fr;}
      aside,.preview{display:none;}
      .mobile-bar{display:flex!important;}
    }
    aside, .preview {
      background: rgba(10,13,20,.78);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--line);
      padding: 22px 18px;
      overflow: auto;
    }
    .preview { border-right: 0; border-left: 1px solid var(--line); }
    .brand {
      font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--gold); font-weight: 700;
    }
    .brand small {
      display: block; color: var(--muted); text-transform: none;
      letter-spacing: 0; font-weight: 400; margin-top: 7px;
    }
    .nav { margin-top: 22px; display: flex; flex-direction: column; gap: 3px; }
    .nav button {
      text-align: left; background: transparent; border: 0; color: var(--muted);
      padding: 8px 10px; border-radius: 10px; cursor: pointer; font: inherit;
      transition: background .2s, color .2s, transform .2s;
    }
    .nav button:hover { background: rgba(227,180,95,.08); color: var(--text); }
    .nav button.active {
      background: linear-gradient(90deg, rgba(227,180,95,.16), rgba(227,180,95,.04));
      color: var(--gold2);
      box-shadow: inset 2px 0 0 var(--gold);
    }
    .nav button .n { display: inline-block; width: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
    .nav button.done .n { color: var(--ok); }
    main { padding: 28px 40px 130px; overflow: auto; }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(28px, 4vw, 42px);
      margin: 0 0 10px; letter-spacing: -.03em; line-height: 1.1;
      background: linear-gradient(180deg, #fff 20%, var(--gold2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lede { color: var(--muted); line-height: 1.65; margin-bottom: 22px; max-width: 68ch; font-size: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    input[type=text], textarea, select {
      width: 100%; background: rgba(8,10,16,.75); border: 1px solid #2a3140;
      color: var(--text); border-radius: 12px; padding: 11px 12px; font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type=text]:focus, textarea:focus, select:focus {
      outline: none; border-color: rgba(227,180,95,.55);
      box-shadow: 0 0 0 3px rgba(227,180,95,.12);
    }
    textarea { min-height: 88px; } textarea.tall { min-height: 120px; }
    .ghost, .gold, .teal, .danger {
      border: 1px solid #313a4a; background: rgba(16,21,28,.8); color: var(--text);
      border-radius: 999px; padding: 9px 14px; cursor: pointer; font: inherit;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .ghost:hover, .teal:hover, .danger:hover { transform: translateY(-1px); }
    .gold {
      background: linear-gradient(180deg, #f0d19a, var(--gold));
      color: var(--ink); border-color: #c89a3e; font-weight: 700;
      box-shadow: 0 8px 24px rgba(227,180,95,.28);
    }
    .gold:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(227,180,95,.38); }
    .teal { color: var(--teal); border-color: rgba(125,206,196,.35); }
    .danger { color: var(--danger); }
    .field-actions { margin-top: 8px; }
    .footer {
      position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px;
      padding-top: 28px; background: linear-gradient(transparent, #08090d 40%);
    }
    .meter {
      height: 7px; background: #1a2130; border-radius: 99px; overflow: hidden;
      margin: 8px 0 20px; border: 1px solid rgba(227,180,95,.12);
    }
    .meter > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--gold), var(--teal), var(--gold));
      background-size: 200% 100%;
      animation: sheen 4s linear infinite;
      box-shadow: 0 0 16px rgba(227,180,95,.45);
      transition: width .4s ease;
    }
    @keyframes sheen { to { background-position: 200% 0; } }
    .preview h2 {
      font-size: 11px; color: var(--gold); letter-spacing: .16em; text-transform: uppercase; margin: 0 0 10px;
    }
    .preview pre {
      white-space: pre-wrap; font-size: 11px; line-height: 1.5; color: #b9c4d4;
      max-height: calc(100vh - 220px); overflow: auto;
      background: rgba(6,8,12,.5); border: 1px solid rgba(255,255,255,.04);
      border-radius: 12px; padding: 12px;
    }
    .drop {
      border: 1px dashed rgba(227,180,95,.35); border-radius: 16px; padding: 22px;
      text-align: center; color: var(--muted);
      background: rgba(227,180,95,.04);
    }
    .mobile-bar {
      display: none; position: sticky; top: 0; z-index: 5;
      background: rgba(10,13,20,.9); backdrop-filter: blur(12px);
      padding: 10px 14px; justify-content: space-between; border-bottom: 1px solid var(--line);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
    .chip {
      font-size: 11px; border: 1px solid var(--line); border-radius: 99px;
      padding: 4px 8px; color: var(--muted); background: rgba(255,255,255,.03);
    }
    .chip.bad { color: var(--danger); border-color: rgba(224,122,106,.35); }
    .chip.good { color: var(--ok); border-color: rgba(143,209,138,.35); }
    .ok { color: var(--ok); } .warn { color: var(--gold2); }
    .kicker {
      color: var(--gold); font-size: 11px; letter-spacing: .2em;
      text-transform: uppercase; font-weight: 700; margin-bottom: 8px;
    }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 18px; }
    @media (max-width:900px){ .grid3 { grid-template-columns: 1fr; } }
    .tile {
      background: linear-gradient(180deg, rgba(32,39,54,.9), rgba(16,20,28,.9));
      border: 1px solid var(--line); border-radius: 18px; padding: 16px;
      min-height: 168px; transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .tile:hover {
      transform: translateY(-3px);
      border-color: rgba(227,180,95,.4);
      box-shadow: 0 16px 40px rgba(0,0,0,.28), 0 0 0 1px rgba(227,180,95,.12);
    }
    .tile .n {
      width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center;
      background: rgba(227,180,95,.12); color: var(--gold); font-size: 12px; font-weight: 700;
      margin-bottom: 12px; border: 1px solid rgba(227,180,95,.25);
    }
    .tile h3 { margin: 0 0 6px; font-size: 16px; font-family: Fraunces, Georgia, serif; }
    .tile p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .flow { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
    .flow span {
      background: rgba(8,10,16,.7); border: 1px solid rgba(227,180,95,.2);
      color: #e8edf4; border-radius: 999px; padding: 6px 10px; font-size: 12px;
    }
    .achieve { display: grid; gap: 8px; }
    .achieve li {
      list-style: none; background: rgba(8,10,16,.55); border: 1px solid #2c3444;
      border-radius: 12px; padding: 11px 12px; color: #d5dbe6; font-size: 14px;
    }
    .achieve li b { color: var(--gold2); }
    ul.achieve { margin: 0; padding: 0; }
    .notthis { color: var(--muted); font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="mobile-bar"><b>Game Intake</b><button class="ghost" onclick="stepNext()">Next</button></div>
  <aside>
    <div class="brand">Game Engineering<small>Intake wizard</small></div>
    <div class="nav" id="nav"></div>
    <div style="margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5">Answers stay in this browser.</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="ghost" onclick="resetAll()">Reset</button><button class="ghost" onclick="exportIntake()">Save intake</button></div>
  </aside>
  <main>
    <div class="meter"><span id="meter"></span></div>
    <div id="screen"></div>
    <div class="footer">
      <button class="ghost" onclick="stepPrev()">Back</button>
      <div><button class="teal" onclick="markSectionUnknown()">Mark empty as Unknown</button> <button class="gold" onclick="stepNext()" id="nextBtn">Next</button></div>
    </div>
  </main>
  <section class="preview"><h2>Live intake</h2><div class="chips" id="chips"></div><pre id="live"></pre></section>
  <script src="wizard-data.js?v=6"></script>
  <script src="wizard-app.js?v=6"></script>
</body>
</html>
