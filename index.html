<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Engineering Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b; --bg2: #0c0c0e; --card: #121214; --line: rgba(255,255,255,.08);
      --text: #f4f4f5; --muted: #a1a1aa; --gold: #e8ff6a; --gold2: #f4ffa8;
      --teal: #c4c4cc; --danger: #fb7185; --ok: #4ade80; --ink: #111113;
      --mx: 70%; --my: 18%;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--text); min-height: 100vh; display: grid;
      grid-template-columns: 264px 1fr 336px; background: var(--bg);
    }
    .fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blob { position: absolute; width: 48vw; height: 48vw; border-radius: 50%; filter: blur(80px); opacity: .28; mix-blend-mode: screen; }
    .blob.a { background: #e8ff6a; top: -18%; right: -8%; animation: driftA 22s ease-in-out infinite alternate; }
    .blob.b { background: #7dd3fc; width: 36vw; height: 36vw; bottom: -12%; left: 18%; opacity: .14; animation: driftB 28s ease-in-out infinite alternate; }
    .blob.c { background: #c4b5fd; width: 28vw; height: 28vw; top: 28%; left: -8%; opacity: .1; animation: driftC 26s ease-in-out infinite alternate; }
    .spot { position: absolute; inset: 0; background: radial-gradient(420px 420px at var(--mx) var(--my), rgba(232,255,106,.09), transparent 55%); }
    .grain {
      position: absolute; inset: 0; opacity: .09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px; animation: grain 1.2s steps(3) infinite;
    }
    @keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(-8%, 10%) scale(1.12); } }
    @keyframes driftB { from { transform: translate(0,0) scale(1); } to { transform: translate(12%, -8%) scale(1.18); } }
    @keyframes driftC { from { transform: translate(0,0); } to { transform: translate(10%, 12%); } }
    @keyframes grain { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-1%,1%)} 66%{transform:translate(1%,-1%)} }
    @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.995); filter:blur(4px);} to { opacity:1; transform:none; filter:none;} }
    aside, main, .preview, .mobile-bar { position: relative; z-index: 1; }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside, .preview { display: none; }
      .mobile-bar { display: flex !important; }
      .bboi-float { display: block !important; }
    }
    aside, .preview {
      background: color-mix(in srgb, var(--bg2) 86%, transparent);
      backdrop-filter: blur(18px); border-right: 1px solid var(--line);
      padding: 24px 16px; overflow: auto;
    }
    aside { display: flex; flex-direction: column; }
    .preview { border-right: 0; border-left: 1px solid var(--line); }
    .brand { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text); font-weight: 600; }
    .brand small { display: block; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; margin-top: 4px; }
    .nav { margin-top: 22px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .nav button { text-align: left; background: transparent; border: 0; color: var(--muted); padding: 8px 10px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13.5px; }
    .nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .nav button.active { background: rgba(255,255,255,.06); color: var(--text); }
    .nav button .n { display: inline-block; width: 22px; color: #71717a; font-size: 12px; }
    .nav button.active .n { color: var(--gold); }
    .nav button.done .n { color: var(--ok); }
    main { padding: 36px 48px 128px; overflow: auto; }
    #screen > * { animation: rise .55s cubic-bezier(.16,1,.3,1) both; }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-size: clamp(34px, 4.4vw, 56px); font-weight: 400; margin: 0 0 14px; letter-spacing: -.04em; line-height: .98; color: #fafafa; }
    .lede { color: var(--muted); line-height: 1.55; margin-bottom: 28px; max-width: 62ch; font-size: 16px; }
    .card, .tile { background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(10px); }
    .card { padding: 18px; margin-bottom: 12px; }
    .card:hover, .tile:hover { border-color: rgba(232,255,106,.22); transform: translateY(-2px); }
    label { display: block; font-weight: 560; margin-bottom: 6px; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    input[type=text], textarea, select { width: 100%; background: #0a0a0b; border: 1px solid rgba(255,255,255,.08); color: var(--text); border-radius: 12px; padding: 12px; font: inherit; }
    input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: rgba(232,255,106,.55); }
    textarea { min-height: 88px; } textarea.tall { min-height: 120px; }
    .ghost, .gold, .teal, .danger { border: 1px solid rgba(255,255,255,.1); background: transparent; color: var(--text); border-radius: 999px; padding: 9px 14px; cursor: pointer; font: inherit; font-size: 14px; }
    .gold { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
    .teal { color: var(--muted); } .danger { color: var(--danger); }
    .field-actions { margin-top: 8px; }
    .footer { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px; padding-top: 32px; background: linear-gradient(transparent, var(--bg) 36%); }
    .meter { height: 3px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; margin: 0 0 28px; }
    .meter > span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .45s cubic-bezier(.16,1,.3,1); }
    .preview h2 { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; font-weight: 500; }
    .preview pre { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.55; color: #d4d4d8; max-height: calc(100vh - 220px); overflow: auto; }
    .drop { border: 1px dashed rgba(255,255,255,.16); border-radius: 16px; padding: 28px 16px; text-align: center; color: var(--muted); }
    .mobile-bar { display: none; position: sticky; top: 0; z-index: 5; background: rgba(9,9,11,.92); padding: 10px 14px; justify-content: space-between; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
    .chip { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
    .chip.bad { color: var(--danger); } .chip.good { color: var(--ok); }
    .kicker { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 16px; }
    @media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
    .tile { padding: 18px 16px; min-height: 164px; }
    .tile .n { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; color: var(--gold); font-size: 11px; margin-bottom: 16px; border: 1px solid rgba(232,255,106,.28); }
    .tile h3 { margin: 0 0 6px; font-size: 16px; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
    .tile p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .flow { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
    .flow span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .achieve { display: grid; gap: 8px; }
    .achieve li { list-style: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; }
    ul.achieve { margin: 0; padding: 0; }

    .bboi { margin-top: 18px; text-align: center; cursor: pointer; user-select: none; }
    .bboi-stage { height: 138px; display: grid; place-items: end center; position: relative; }
    .spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #e8ff6a; opacity: 0; }
    .on .spark { animation: spark 14s linear 1; }
    .spark:nth-child(2) { left: 22%; animation-delay: .2s; }
    .spark:nth-child(3) { left: 48%; animation-delay: .8s; }
    .spark:nth-child(4) { left: 70%; animation-delay: 1.6s; }
    .spark:nth-child(5) { left: 36%; animation-delay: 4.2s; }
    .spark:nth-child(6) { left: 62%; animation-delay: 7.4s; }
    .spark:nth-child(7) { left: 50%; animation-delay: 10.8s; }
    .floor {
      position: absolute; left: 16%; right: 16%; bottom: 10px; height: 10px;
      background: radial-gradient(ellipse, rgba(232,255,106,.22), transparent 70%);
      filter: blur(2px);
    }
    .on .floor { animation: floorPulse 14s linear 1; }
    .wiz { position: relative; width: 70px; height: 108px; transform-origin: 50% 86%; animation: idle 2.6s ease-in-out infinite; }
    .on .wiz { animation: routine 14s cubic-bezier(.22,.61,.36,1) 1; }
    .hat { position: absolute; left: 18px; top: 0; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 26px solid #e8ff6a; z-index: 3; transform-origin: 50% 100%; }
    .on .hat { animation: hat 14s linear 1; }
    .hat::after { content: ""; position: absolute; left: -4px; top: -6px; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #e8ff6a; }
    .head { position: absolute; left: 22px; top: 20px; width: 26px; height: 26px; background: #f5d0b0; border-radius: 50%; z-index: 2; }
    .beard { position: absolute; left: 24px; top: 36px; width: 22px; height: 14px; background: #ece7dc; border-radius: 0 0 12px 12px; z-index: 2; }
    .torso { position: absolute; left: 18px; top: 46px; width: 34px; height: 32px; background: #6d4aff; border-radius: 10px 10px 6px 6px; z-index: 1; }
    .arm { position: absolute; top: 50px; width: 8px; height: 26px; background: #5b3de0; border-radius: 8px; transform-origin: 50% 0; z-index: 1; }
    .arm.l { left: 10px; transform: rotate(16deg); }
    .arm.r { right: 10px; transform: rotate(-14deg); }
    .on .arm.l { animation: armL 14s linear 1; }
    .on .arm.r { animation: armR 14s linear 1; }
    .leg { position: absolute; top: 74px; width: 9px; height: 28px; background: #3f2aa8; border-radius: 8px; transform-origin: 50% 0; }
    .leg.l { left: 22px; } .leg.r { left: 40px; }
    .on .leg.l { animation: legL 14s linear 1; }
    .on .leg.r { animation: legR 14s linear 1; }
    .staff { position: absolute; left: 2px; top: 18px; width: 3px; height: 78px; background: #e8ff6a; border-radius: 3px; transform-origin: 50% 100%; transform: rotate(-8deg); }
    .on .staff { animation: staff 14s linear 1; }
    .staff::before { content: ""; position: absolute; top: -6px; left: -4px; width: 11px; height: 11px; border: 2px solid #e8ff6a; border-radius: 50%; }
    .bboi-move { margin-top: 2px; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; min-height: 16px; }
    .bboi-move::after { content: "hover or tap"; }
    .on .bboi-move::after { animation: moveName 14s linear 1; }
    .bboi-float { display: none; position: fixed; left: 14px; bottom: 14px; z-index: 8; width: 132px; background: rgba(12,12,14,.72); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 8px; backdrop-filter: blur(10px); }
    .on { filter: drop-shadow(0 0 18px rgba(232,255,106,.28)); }

    @keyframes idle {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes spark {
      0%,12% { opacity: 0; transform: translateY(0) scale(.4); }
      16% { opacity: 1; transform: translateY(-18px) scale(1); }
      28% { opacity: 0; transform: translateY(-42px) scale(.2); }
      100% { opacity: 0; }
    }
    @keyframes routine {
      0% { transform: translateY(0) rotate(0); }
      4% { transform: translateY(-10px) rotate(-12deg); }
      7% { transform: translateY(0) rotate(10deg); }
      10% { transform: translateY(-8px) rotate(-6deg) scaleX(-1); }
      13% { transform: translateY(0) rotate(8deg) scaleX(-1); }
      16% { transform: translateY(-14px) rotate(0) scaleX(1); }
      19% { transform: translate(12px,4px) rotate(-28deg); }
      24% { transform: translate(-6px,22px) rotate(-100deg); }
      31% { transform: translate(-6px,22px) rotate(-108deg); }
      36% { transform: translate(8px,24px) rotate(18deg); }
      42% { transform: translate(0,26px) rotate(360deg); }
      50% { transform: translate(0,26px) rotate(1080deg); }
      55% { transform: translateY(0) rotate(0); }
      61% { transform: translateY(18px) rotate(220deg); }
      68% { transform: translateY(18px) rotate(700deg); }
      73% { transform: translate(14px,20px) rotate(-80deg) scaleX(-1); }
      80% { transform: translate(-10px,8px) rotate(25deg) scaleX(-1); }
      86% { transform: translateY(-16px) rotate(-8deg) scaleX(1); }
      92% { transform: translateY(0) rotate(12deg); }
      100% { transform: translateY(0) rotate(0); }
    }
    @keyframes armL {
      0%,8% { transform: rotate(16deg); }
      12% { transform: rotate(-80deg); }
      18% { transform: rotate(70deg); }
      24%,32% { transform: rotate(125deg); }
      40% { transform: rotate(-10deg); }
      50% { transform: rotate(30deg); }
      62%,70% { transform: rotate(-40deg); }
      78% { transform: rotate(100deg); }
      88% { transform: rotate(-60deg); }
      100% { transform: rotate(16deg); }
    }
    @keyframes armR {
      0%,6% { transform: rotate(-14deg); }
      10% { transform: rotate(85deg); }
      16% { transform: rotate(-30deg); }
      24%,32% { transform: rotate(-140deg); }
      38% { transform: rotate(20deg); }
      50% { transform: rotate(50deg); }
      62%,70% { transform: rotate(95deg); }
      78% { transform: rotate(-90deg); }
      90% { transform: rotate(40deg); }
      100% { transform: rotate(-14deg); }
    }
    @keyframes legL {
      0%,8% { transform: rotate(0); }
      12% { transform: rotate(-40deg); }
      18% { transform: rotate(18deg); }
      24%,32% { transform: rotate(80deg); }
      42% { transform: rotate(-25deg); }
      50% { transform: rotate(15deg); }
      62%,70% { transform: rotate(90deg); }
      78% { transform: rotate(-20deg); }
      88% { transform: rotate(45deg); }
      100% { transform: rotate(0); }
    }
    @keyframes legR {
      0%,8% { transform: rotate(0); }
      14% { transform: rotate(48deg); }
      20% { transform: rotate(-10deg); }
      24%,32% { transform: rotate(-30deg); }
      42% { transform: rotate(20deg); }
      50% { transform: rotate(-15deg); }
      62%,70% { transform: rotate(-85deg); }
      80% { transform: rotate(55deg); }
      90% { transform: rotate(-20deg); }
      100% { transform: rotate(0); }
    }
    @keyframes staff {
      0%,10% { transform: rotate(-8deg); }
      16% { transform: rotate(40deg); }
      24%,32% { transform: rotate(95deg); }
      40% { transform: rotate(-20deg); }
      50% { transform: rotate(10deg); }
      64% { transform: rotate(130deg); }
      76% { transform: rotate(-35deg); }
      88% { transform: rotate(25deg); }
      100% { transform: rotate(-8deg); }
    }
    @keyframes hat {
      0%,20% { transform: rotate(0); }
      26% { transform: rotate(-28deg); }
      42%,52% { transform: rotate(18deg); }
      64% { transform: rotate(-20deg); }
      80% { transform: rotate(12deg); }
      100% { transform: rotate(0); }
    }
    @keyframes floorPulse {
      0%,10% { opacity: .3; transform: scaleX(.75); }
      24%,32% { opacity: 1; transform: scaleX(1.15); }
      42%,52% { opacity: 1; transform: scaleX(1.2); }
      62%,72% { opacity: .9; transform: scaleX(1.1); }
      100% { opacity: .3; transform: scaleX(.75); }
    }
    @keyframes moveName {
      0%,11% { content: "toprock"; }
      12%,18% { content: "six-step"; }
      19%,24% { content: "kick"; }
      25%,35% { content: "baby freeze"; }
      36%,54% { content: "headspin"; }
      55%,74% { content: "windmill"; }
      75%,86% { content: "swipe"; }
      87%,95% { content: "air flare"; }
      96%,100% { content: "drop"; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .grain, #screen > *, .wiz, .arm, .leg, .staff, .hat, .floor, .spark, .bboi-move::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true">
    <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
    <div class="spot"></div><div class="grain"></div>
  </div>
  <div class="mobile-bar"><b>Game Intake</b><button class="ghost" onclick="stepNext()">Next</button></div>
  <aside>
    <div class="brand">Game Engineering<small>Intake wizard</small></div>
    <div class="nav" id="nav"></div>
    <div class="bboi" title="Hover or click to battle">
      <div class="bboi-stage">
        <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
        <div class="floor"></div>
        <div class="wiz">
          <div class="staff"></div><div class="hat"></div><div class="head"></div><div class="beard"></div>
          <div class="arm l"></div><div class="arm r"></div><div class="torso"></div>
          <div class="leg l"></div><div class="leg r"></div>
        </div>
      </div>
      <div class="bboi-move"></div>
    </div>
    <div style="margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5">Answers stay in this browser.</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="ghost" onclick="resetAll()">Reset</button><button class="ghost" onclick="exportIntake()">Save intake</button></div>
  </aside>
  <main>
    <div class="meter"><span id="meter"></span></div>
    <p id="storageStatus" role="status" class="warn"></p>
    <noscript>This optional wizard needs JavaScript. Read <a href="PROMPT.md">the standalone AI protocol</a> instead.</noscript>
    <div id="screen"></div>
    <div class="footer">
      <button class="ghost" onclick="stepPrev()">Back</button>
      <div><button class="teal" onclick="markSectionUnknown()">Mark empty as Unknown</button> <button class="gold" onclick="stepNext()" id="nextBtn">Next</button></div>
    </div>
  </main>
  <section class="preview"><h2>Live intake</h2><div class="chips" id="chips"></div><pre id="live"></pre></section>
  <div class="bboi bboi-float" title="Hover or tap to battle">
    <div class="bboi-stage">
      <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <div class="floor"></div>
      <div class="wiz">
        <div class="staff"></div><div class="hat"></div><div class="head"></div><div class="beard"></div>
        <div class="arm l"></div><div class="arm r"></div><div class="torso"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
    </div>
    <div class="bboi-move"></div>
  </div>
  <script src="wizard-data.js?v=3"></script>
  <script src="prompt-data.js?v=3"></script>
  <script src="wizard-app.js?v=3"></script>
  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) {
        var ticking = false;
        window.addEventListener("pointermove", function (e) {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () {
            document.body.style.setProperty("--mx", e.clientX + "px");
            document.body.style.setProperty("--my", e.clientY + "px");
            ticking = false;
          });
        });
      }
      function restart(box) {
        box.classList.remove("on");
        void box.offsetWidth;
        box.classList.add("on");
      }
      function bind(box) {
        var lock = false;
        var timer;
        box.addEventListener("pointerenter", function () {
          if (reduce || lock) return;
          restart(box);
        });
        box.addEventListener("pointerleave", function () {
          if (lock) return;
          box.classList.remove("on");
        });
        box.addEventListener("click", function () {
          if (reduce) return;
          lock = true;
          restart(box);
          clearTimeout(timer);
          timer = setTimeout(function () {
            lock = false;
            box.classList.remove("on");
          }, 14000);
        });
      }
      document.querySelectorAll(".bboi").forEach(bind);
    })();
  </script>
</body>
</html>
